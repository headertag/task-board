name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
      - run: node --experimental-transform-types --import ./tests/loader.mjs tests/mcp-metadata.test.mjs
      - run: node --import tsx --test tests/production-deployment.test.mjs
      - run: npm run build
      - name: Retain the checked production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 7
  deploy:
    name: Deploy production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.TASK_BOARD_PRODUCTION_ORIGIN }}
    concurrency:
      group: task-board-production
      queue: max
      cancel-in-progress: false
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: worker-${{ github.sha }}
          path: dist/
      - name: Validate, migrate schema, deploy checked build, and smoke test
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TASK_BOARD_PRODUCTION_ORIGIN: ${{ vars.TASK_BOARD_PRODUCTION_ORIGIN }}
          TASK_BOARD_D1_DATABASE_ID: ${{ vars.TASK_BOARD_D1_DATABASE_ID }}
          TASK_BOARD_D1_DATABASE_NAME: ${{ vars.TASK_BOARD_D1_DATABASE_NAME }}
          TASK_BOARD_R2_BUCKET_NAME: ${{ vars.TASK_BOARD_R2_BUCKET_NAME }}
          TASK_BOARD_WORKOS_ENVIRONMENT: ${{ vars.TASK_BOARD_WORKOS_ENVIRONMENT }}
          WORKOS_AUTHKIT_ISSUER: ${{ vars.WORKOS_AUTHKIT_ISSUER }}
          WORKOS_BROWSER_CLIENT_ID: ${{ vars.WORKOS_BROWSER_CLIENT_ID }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          TASK_BOARD_SESSION_SECRET: ${{ secrets.TASK_BOARD_SESSION_SECRET }}
          TASK_BOARD_AUTH_POLICY: ${{ secrets.TASK_BOARD_AUTH_POLICY }}
          TASK_BOARD_INITIAL_MIGRATION_APPROVED: ${{ vars.TASK_BOARD_INITIAL_MIGRATION_APPROVED }}
          TASK_BOARD_ENABLE_WRITES: ${{ vars.TASK_BOARD_ENABLE_WRITES }}
        run: node --import tsx scripts/production-deploy.mjs
